name: Update Prop Board

on:
  schedule:
    # every 30 minutes from 10 AM to 2 AM Eastern (times here are UTC)
    - cron: "*/30 0-6,14-23 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: prop-board
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Pull fresh NBA data
        run: python3 update.py || echo "NBA update hit an error; keeping the last good data"

      - name: Pull fresh NFL data
        run: python3 nfl_update.py || echo "NFL update hit an error; keeping the last good data"

      - name: Save data to the repo
        run: |
          git config user.name "prop-board-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update board data"
            git pull --rebase origin main
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deploy
        uses: actions/deploy-pages@v4
